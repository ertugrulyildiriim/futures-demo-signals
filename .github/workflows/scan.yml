name: Bybit Public API Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Bybit public market API
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = "https://api-demo.bybit.com/v5/market/tickers?category=linear&symbol=BTCUSDT"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=20) as response:
              data = json.loads(response.read().decode())

          if data.get("retCode") != 0:
              raise RuntimeError(data)

          ticker = data["result"]["list"][0]
          print("BYBIT BAGLANTISI BASARILI")
          print("BTCUSDT SON FIYAT:", ticker["lastPrice"])
          PY
